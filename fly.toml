# Fly.io configuration for the FitTrack API.
# Docs: https://fly.io/docs/reference/configuration/
#
# Before the first deploy:
#   fly apps create fittrack-api-claudiovolnei   # or rename `app` below to a free name
#   fly secrets set ConnectionStrings__fittrack="Host=...;Database=...;Username=...;Password=...;SSL Mode=Require"
#   fly secrets set Jwt__SigningKey="<at least 32 random characters>"
#   fly deploy

app = "fittrack-api-claudiovolnei"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # Applies the EF Core migrations on boot (Program.cs). Keep it true on a single machine.
  Database__MigrateOnStartup = "true"
  # Browser origin served by Cloudflare Workers. Add one numbered entry per extra origin.
  Cors__AllowedOrigins__0 = "https://fit-track.claudiovolneisilva.workers.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Cheapest sensible size for ASP.NET Core + EF Core; raise to 1gb if the API gets busy.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
